name: props-backfill
on:
  workflow_dispatch:
    inputs:
      seasons: {description: 'Seasons', default: '2025'}
      weeks: {description: 'Weeks', default: '1 2 3'}
      max_credits: {description: 'Credit cap', default: '480'}
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas requests nflreadpy polars pyarrow
      - name: Pull prop lines
        env:
          ENDZONEAPI_API_KEY: ${{ secrets.ENDZONEAPI_API_KEY }}
        run: python Backfill.py --seasons ${{ github.event.inputs.seasons }} --weeks ${{ github.event.inputs.weeks }} --max-credits ${{ github.event.inputs.max_credits }}
      - name: Keep raw vendor data private
        uses: actions/upload-artifact@v4
        with:
          name: props-data-private
          path: data/props_private
          retention-days: 90
      - name: Commit only the summary
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/props_summary
          git diff --cached --quiet || git commit -m "props summary"
          git push
